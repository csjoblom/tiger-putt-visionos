name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict

  test:
    name: Tests
    needs: lint
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project xr-tiger-putt.xcodeproj -scheme "xr-tiger-putt"
      - name: Run tests (visionOS simulator)
        run: |
          xcodebuild test \
            -project xr-tiger-putt.xcodeproj \
            -scheme "xr-tiger-putt" \
            -destination 'platform=visionOS Simulator,name=Apple Vision Pro' \
            -skipPackagePluginValidation \
            -skipMacroValidation
